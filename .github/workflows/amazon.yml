name: Amazon Best Sellers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/amazon_bestsellers.py", ".github/workflows/amazon.yml"]

permissions:
  contents: write

jobs:
  bestsellers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect
        run: python scraper/amazon_bestsellers.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon debug/amazon
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%F) Amazon best sellers"
          git pull --rebase origin main
          git push
