name: Collect TikTok Shop rankings

on:
  schedule:
    - cron: "23 1 * * *"   # 매일 10:23 KST
  workflow_dispatch:
    inputs:
      markets:
        description: "수집할 국가 id (공백 구분, 비우면 전체)"
        required: false
  push:
    branches: [main]
    paths: ["config/**", "scraper/**", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect
        run: python scraper/collect.py ${{ github.event.inputs.markets }}
      - name: Build dashboard data
        run: python scraper/build.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data debug docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%F) TikTok Shop snapshot"
          git pull --rebase origin main
          git push
