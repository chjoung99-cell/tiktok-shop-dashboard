# Keepa(Amazon) Best Sellers 모니터링 카테고리.
#   domain: 1=미국 amazon.com, 2=영국 .co.uk, 3=독일, 5=일본 .co.jp, 6=캐나다
#   node:   Amazon 카테고리 노드 ID. 모르면 비워두고 term/root 를 적으면
#           첫 실행 때 Keepa 카테고리 검색으로 찾아 data/keepa/categories.json 에 저장한다.
#   term:   카테고리 검색어 (카테고리 이름과 정확히 일치해야 함)
#   root:   최상위 카테고리 이름 (동명 카테고리 구분용)
